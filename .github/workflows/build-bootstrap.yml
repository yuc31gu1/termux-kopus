name: Build kopus bootstrap

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # weekly refresh

permissions:
  contents: write

jobs:
  build-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout termux-packages
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          fetch-depth: 1000

      - name: Patch package name to kopus
        run: |
          sed -i 's/TERMUX_APP__PACKAGE_NAME="com.termux"/TERMUX_APP__PACKAGE_NAME="com.termux.kopus"/' scripts/properties.sh
          grep -n "TERMUX_APP__PACKAGE_NAME=" scripts/properties.sh | head -3

      - name: Patch license search to find exact-case variants
        run: |
          python3 - <<'EOF'
          import re
          p = 'scripts/build/termux_step_install_license.sh'
          s = open(p).read()
          old = "COMMON_LICENSE_FILES=( # search list for licenses with copyright information"
          new = ("COMMON_LICENSE_FILES=( 'LICENSE.md' 'LICENSE' 'COPYING' 'License.md' 'COPYING.md'"
                  " 'license-bsd-2-clause.txt' 'LICENSE.txt' 'LICENSE-MIT'"
                  " # search list for licenses with copyright information")
          assert old in s
          s = s.replace(old, new)
          open(p, 'w').write(s)
          print("patched")
          EOF
          grep -n "LICENSE.md" scripts/build/termux_step_install_license.sh | head

      - name: Ensure container + install Android SDK components for termux-am
        run: |
          set -o pipefail
          ./scripts/run-docker.sh bash -lc '
            set -x
            SDK="$HOME/lib/android-sdk-9123335"
            ls -la "$SDK" | head -20
            echo "sdkmanager candidates:"
            find "$SDK" -maxdepth 4 -name sdkmanager 2>/dev/null
            SM="$(find "$SDK" -maxdepth 4 -name sdkmanager 2>/dev/null | head -1)"
            if [ -n "$SM" ]; then
              yes | "$SM" --sdk_root="$SDK" --install "build-tools;30.0.3" "platforms;android-33"
              echo "install exit: $?"
              ls "$SDK/build-tools" 2>/dev/null
              ls "$SDK/platforms" 2>/dev/null
            else
              echo "NO SDKMANAGER FOUND"
            fi
          ' 2>&1 | tail -40

      - name: Build aarch64 bootstrap from source
        run: |
          set -o pipefail
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --architectures aarch64 2>&1 | tee /tmp/bootstrap-build.log | tail -60

      - name: List output
        run: |
          ls -la /home/runner/work/termux-kopus/termux-kopus/bootstrap-aarch64.zip 2>/dev/null || true
          find / -name "bootstrap-aarch64.zip" 2>/dev/null | head

      - name: Compute checksum
        id: checksum
        run: |
          sha256sum bootstrap-aarch64.zip

      - name: Publish bootstrap release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create bootstrap-kopus bootstrap-aarch64.zip \
            --title "kopus bootstrap (aarch64)" \
            --notes "Termux bootstrap recompiled with prefix /data/data/com.termux.kopus/files" \
            --repo ${{ github.repository }} --clobber || \
          gh release upload bootstrap-kopus bootstrap-aarch64.zip \
            --repo ${{ github.repository }} --clobber

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kopus-bootstrap-aarch64
          path: bootstrap-aarch64.zip