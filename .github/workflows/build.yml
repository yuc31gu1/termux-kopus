name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (for Android SDK tools)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager --install "platforms;android-28" "build-tools;28.0.3" "ndk;21.3.6528147"
          yes | sdkmanager --licenses > /dev/null

      - name: Set up JDK 8 (for Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.KOPUS_KEYSTORE }}" | base64 -d > kopus-keystore.jks
        shell: bash

      - name: Build release APK
        env:
          KOPUS_KEYSTORE: ${{ github.workspace }}/kopus-keystore.jks
          KOPUS_KEYSTORE_PASSWORD: ${{ secrets.KOPUS_KEYSTORE_PASSWORD }}
          KOPUS_KEY_ALIAS: ${{ secrets.KOPUS_KEY_ALIAS }}
          KOPUS_KEY_PASSWORD: ${{ secrets.KOPUS_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kopus-apk
          path: app/build/outputs/apk/release/*.apk